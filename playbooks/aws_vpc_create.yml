---
- name: Provision AWS Network Infrastructure
  hosts: localhost
  gather_facts: false

  vars:
    # Maps directly to your form_region variable
    target_region: "{{ form_region | default('us-east-1') }}"

  tasks:
    - name: Create the Virtual Private Cloud (VPC)
      amazon.aws.ec2_vpc_net:
        name: "{{ form_vpc_name }}"
        cidr_block: "{{ form_vpc_cidr }}"
        region: "{{ target_region }}"
        tags:
          Environment: "{{ form_environment_tag }}"
          ManagedBy: "AnsibleForms"
      register: vpc_result

    - name: Create Internet Gateway for Public Routing
      amazon.aws.ec2_vpc_igw:
        vpc_id: "{{ vpc_result.vpc.id }}"
        region: "{{ target_region }}"
        state: present
        tags:
          Name: "{{ form_vpc_name }}-igw"
          Environment: "{{ form_environment_tag }}"
      register: igw_result

    - name: Provision Public Subnet within the VPC
      amazon.aws.ec2_vpc_subnet:
        vpc_id: "{{ vpc_result.vpc.id }}"
        cidr: "{{ form_public_subnet_cidr }}"
        region: "{{ target_region }}"
        map_public: true
        tags:
          Name: "{{ form_vpc_name }}-public-subnet"
          Environment: "{{ form_environment_tag }}"
      register: subnet_result

    - name: Create and Bind Public Route Table to Internet Gateway
      amazon.aws.ec2_vpc_route_table:
        vpc_id: "{{ vpc_result.vpc.id }}"
        region: "{{ target_region }}"
        subnets:
          - "{{ subnet_result.subnet.id }}"
        routes:
          - dest: 0.0.0.0/0
            gateway_id: "{{ igw_result.gateway_id }}"
        tags:
          Name: "{{ form_vpc_name }}-public-rt"
          Environment: "{{ form_environment_tag }}"

    # Output the results of the VPC creation process
    - name: Render Infrastructure Topology Output
      ansible.builtin.debug:
        msg:
          - "========================================="
          - "     AWS VPC NETWORK SUCCESSFULLY BUILT   "
          - "========================================="
          - "VPC Name:       {{ form_vpc_name }}"
          - "VPC ID:         {{ vpc_result.vpc.id }}"
          - "Region:         {{ target_region }}"
          - "VPC CIDR Range: {{ form_vpc_cidr }}"
          - "Public Subnet:  {{ subnet_result.subnet.id }} ({{ form_public_subnet_cidr }})"
          - "Internet GW:    {{ igw_result.gateway_id }}"
          - "Tagging Tier:   {{ form_environment_tag }}"
          - "========================================="