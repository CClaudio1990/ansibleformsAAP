- name: Create AWS VPC
  description: Provision a standardized AWS Virtual Private Cloud (VPC) via AAP 2.7
  type: aap
  template: create-vpc-template
  roles: []
  categories: []
  fields:
    - name: form_vpc_name
      type: text
      label: VPC Name
      placeholder: e.g., prod-vpc-useast1
      required: true
    - name: form_region
      type: enum
      label: AWS Region
      values:
        - Select
        - us-east-1
        - us-west-2
        - eu-west-1
      default: Select
      required: true
    - name: form_vpc_cidr
      type: text
      label: VPC IPv4 CIDR Block
      placeholder: e.g., 10.0.0.0/16
      default: 10.0.0.0/16
      required: true
    - name: form_public_subnet_cidr
      type: text
      label: Public Subnet CIDR Block
      placeholder: e.g., 10.0.1.0/24
      default: 10.0.1.0/24
      required: true
    - name: form_environment_tag
      type: enum
      label: Environment Tier
      values:
        - Development
        - Staging
        - Production
      default: Development
      required: true
- name: Create AWS EC2 Instance Test
  description: Provision a standardized AWS EC2 Virtual Machine via AAP / AnsibleForms
  type: aap
  template: create-ec2-template
  roles: []
  categories: []
  fields:
    - name: form_instance_name
      type: text
      label: Instance Name
      placeholder: e.g., app-server-01
      required: true
    - name: form_region
      type: enum
      label: AWS Region
      values:
        - Select
        - us-east-1
        - us-west-2
        - eu-west-1
      default: Select
      required: true
    - name: form_vpc_id
      type: enum
      label: Select VPC ID
      required: true
      refresh: true
      expression: >
        if(form_region && form_region != 'Select'){
          fn.fnRestBasic(
            'GET',
            'https://nsdb4l531k.execute-api.us-west-2.amazonaws.com/aws-metadata?action=vpcs&region=' + reg,
            '',
            '',
            '.'
          )
        } else {
          return []
        }
      valueColumn: id
      displayColumn: name
    - name: form_subnet_id
      type: enum
      label: Target Subnet ID
      required: true
      refresh: true
      expression: >
        if(form_region && form_region != 'Select'){
          fn.fnRestBasic(
          'GET',
          'https://nsdb4l531k.execute-api.us-west-2.amazonaws.com/aws-metadata?action=subnets&region=' + reg,
          '', 
          '',
          '.' 
          )
        } else {
          return []
        }
      valueColumn: id
      displayColumn: name
    - name: form_instance_type
      type: enum
      label: Instance Type
      values:
        - t3.micro
        - t3.small
        - t3.medium
        - t3.large
        - m5.large
      default: t3.micro
      required: true
    - name: form_ami_id
      type: text
      label: AMI ID
      placeholder: e.g., ami-0c7217cdde317cfec (Amazon Linux / Ubuntu)
      required: true
    - name: form_key_name
      type: enum
      label: SSH Key Pair Name
      required: true
      refresh: true
      expression: >
        if(form_region && form_region != 'Select'){
          fn.fnRestBasic(
          'GET',
          'https://nsdb4l531k.execute-api.us-west-2.amazonaws.com/aws-metadata?action=key-pairs&region=' + reg,
          '', 
          '', 
          '.' 
          )
        } else {
          return []
        }
    - name: form_root_volume_size
      type: text
      label: Root Volume Size (GiB)
      default: "20"
      placeholder: e.g., 20, 50, 100
      required: true
    - name: form_allowed_ssh_cidr
      type: text
      label: Allowed SSH Inbound CIDR
      default: 0.0.0.0/0
      placeholder: e.g., 203.0.113.25/32 or 0.0.0.0/0
      required: true
    - name: form_assign_public_ip
      type: enum
      label: Auto-Assign Public IPv4
      values:
        - "true"
        - "false"
      default: "true"
      required: true
    - name: form_environment_tag
      type: enum
      label: Environment Tier
      values:
        - Development
        - Staging
        - Production
      default: Development
      required: true
