---
- name: Display Personal Information Playbook
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: Print the personal information playbook record
      ansible.builtin.debug:
        msg:
          - "========================================"
          - "       PERSONAL INFORMATION PLAYBOOK    "
          - "========================================"
          - "Name:    {{ form_first_name }} {{ form_last_name }}"
          - "City:    {{ form_city }}"
          - "State:   {{ form_state }}"
          - "Email:   {{ form_email }}"
          - "========================================"
