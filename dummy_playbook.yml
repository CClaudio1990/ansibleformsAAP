---
- name: Process Inputs from AnsibleForms
  hosts: localhost
  gather_facts: false
  vars:
    target_hostname: "default-host"
    environment_type: "dev"
    admin_email: "admin@example.com"

  tasks:
    - name: Display received variables
      ansible.builtin.debug:
        msg:
          - "Target Hostname: {{ target_hostname }}"
          - "Environment:     {{ environment_type }}"
          - "Admin Email:     {{ admin_email }}"

    - name: Perform deployment task
      ansible.builtin.debug:
        msg: "Deploying {{ target_hostname }} to {{ environment_type }} tier..."
